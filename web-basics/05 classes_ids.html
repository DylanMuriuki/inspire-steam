    <title>Module05: classes, ids</title>
</head>
<body>
    <!--
    id: unique,only one element in a page should have it
    class: reusable, used to identify multiple elements together
    -->

    <div id="page-wrapper">
        <h1>NSYNC</h1>
        <p>Disc:A blast from the past </p>

        <img class="Band photos" src="assets/images/nsync pic 1.webp" alt="Band photo">
        <img class="Band photos" src="assets/images/nsync pic 2.jpg" alt="Band photo">
        
        
    </div>
    
</body>
</html>
